ahoyapi: v2
env: .env
commands:
  test-global:
    cmd: echo $GLOBAL

  test-cmd:
    cmd: echo $COMMAND
    env:
      - .env.cmd

  test-override:
    cmd: echo $TO_BE_OVERRIDDEN
    env: .env.cmd

  test-multiple-cmd-overridden:
    cmd: echo $TO_BE_OVERRIDDEN
    env:
      - .env
      - .env.cmd

  test-multiple-with-missing-cmd:
    cmd: echo $COMMAND
    env:
      - path: .env.not-here
        optional: true
      - .env.cmd

  test-multiple-with-missing-cmd-and-override:
    cmd: echo $COMMAND
    env:
      - path: .env.not-here
        optional: true
      - .env.cmd
      - .env

  test-nonexistent-env:
    cmd: echo "This should not print!"
    env:
      - path: .env.thisfiledoesntexist
        optional: true

  test-keep-established-env-vars:
    cmd: echo $ENV_CLOBBER_TEST
