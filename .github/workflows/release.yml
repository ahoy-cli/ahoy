name: "Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Perform a dry run (no release created)"
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Make sure only the canonical repository publishes releases.
    if: github.repository == 'ahoy-cli/ahoy'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
          # Disabled to avoid cache-poisoning of release artefacts (zizmor).
          cache: false

      - name: Install Cosign for signing
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # Pinned so a cosign major release cannot change the signing flags
          # underneath us. v3 removed --output-signature/--output-certificate
          # in favour of --bundle, which is what .goreleaser.yaml uses.
          cosign-release: "v3.1.3"

      - name: Install Syft for SBOM generation
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          # Pinned for reproducible, deterministic SBOM generation (no "latest" drift).
          syft-version: "v1.45.1"

      - name: Determine release mode
        id: release_mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
            echo "args=release --clean --skip=announce,publish --snapshot" >> "$GITHUB_OUTPUT"
            echo "Running in DRY RUN mode - no release will be created"
            echo "Generated artifacts will be displayed in the workflow output"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "false" ]; then
            echo "mode=manual-release" >> "$GITHUB_OUTPUT"
            echo "args=release --clean" >> "$GITHUB_OUTPUT"
            echo "Running MANUAL RELEASE mode - real (draft) release will be created"
          else
            echo "mode=tag-release" >> "$GITHUB_OUTPUT"
            echo "args=release --clean" >> "$GITHUB_OUTPUT"
            echo "Running TAG RELEASE mode - triggered by tag push"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ steps.release_mode.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display dry run artifacts
        if: steps.release_mode.outputs.mode == 'dry-run'
        run: |
          echo "DRY RUN COMPLETED - Artifacts that would have been created:"
          echo "============================================================"

          if [ -d "dist" ]; then
            echo "Directory structure:"
            find dist -type f | sort
            echo ""
            echo "File sizes:"
            find dist -type f -exec ls -lh {} \; | awk '{print $5 "\t" $9}' | sort -k2
            echo ""
            echo "Archive contents preview:"
            for file in dist/*.tar.gz dist/*.zip; do
              if [ -f "$file" ]; then
                echo "Contents of $(basename "$file"):"
                if [[ "$file" == *.tar.gz ]]; then
                  tar -tzf "$file" | head -10
                elif [[ "$file" == *.zip ]]; then
                  unzip -l "$file" | head -15
                fi
                echo "---"
              fi
            done 2>/dev/null
          else
            echo "Warning: No dist directory found - check GoReleaser configuration"
          fi

      - name: Upload additional artifacts
        if: always() && hashFiles('dist/**/*') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.release_mode.outputs.mode == 'dry-run' && 'dry-run-artifacts' || 'release-artifacts' }}
          path: |
            dist/
          retention-days: ${{ steps.release_mode.outputs.mode == 'dry-run' && '7' || '30' }}

  post-release:
    name: Post-Release Tasks
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    # Only run for real releases (tag-triggered or manual with dry_run=false)
    if: needs.release.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false'))
    env:
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update documentation
        run: |
          echo "Release ${REF_NAME} completed successfully!"
          echo "Binaries and archives are available in the GitHub release."
          echo "Individual binaries are uploaded as separate assets."

      - name: Notify on success
        if: success()
        run: |
          echo "Release ${REF_NAME} completed successfully!"
          echo "Archives and individual binaries are available in the release."
          echo "Checksums and signatures (if configured) are included."

      - name: Notify on failure
        if: failure()
        run: |
          echo "Error: Release ${REF_NAME} failed!"
          echo "Please check the workflow logs for details."
          exit 1
