# Dependabot version updates. Options reference:
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  # Go modules for v3, the module at the repo root.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    assignees:
      - "ocean"

  # GitHub Actions. Dependabot looks for .github/workflows under this
  # directory, so it must be the repo root.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    assignees:
      - "ocean"
    groups:
      # init, autobuild and analyze must run the same version, so bump them
      # together.
      codeql-action:
        patterns:
          - "github/codeql-action*"
