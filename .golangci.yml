version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - dogsled
    - errcheck
    - exhaustive
    - gocognit
    - goconst
    - goheader
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nestif
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    goconst:
      # Repeated literals in tests are idiomatic and are excluded from
      # reporting below, so they should not inflate counts for real code either.
      ignore-tests: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Repeated literals in table-driven tests are idiomatic, and long test
      # tables are not complexity debt, so goconst/gocognit are not useful here.
      - linters:
          - bodyclose
          - gocognit
          - goconst
          - gosec
          - noctx
          - unparam
        path: _test\.go
      - linters:
          - gosec
        path: fixtures.go
      - path: (.+)\.go$
        text: composite literal uses unkeyed fields
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
