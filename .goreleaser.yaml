# Goreleaser config for ahoy.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

env:
  - GO111MODULE=on
  - GOPROXY=https://proxy.golang.org,direct
before:
  hooks:
    - go mod download
    - go mod tidy
    - go test ./...

builds:
  # Standard build
  - id: ahoy
    dir: .
    # Binary name format: ahoy-bin-{os}-{arch}[v{arm_version}]
    binary: "{{ .ProjectName }}-bin-{{ .Os }}-{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarm: "6"
      - goos: windows
        goarm: "7"
      - goos: darwin
        goarch: arm
    flags:
      - -trimpath
      - -v
    ldflags:
      - -s -w
      - -X main.version={{ .Tag }}
      - -X main.GitCommit={{ .ShortCommit }}
      - -X main.GitBranch={{ .Branch }}
      - -X main.BuildTime={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # Static build for Linux (useful for containers)
  - id: ahoy-static
    dir: .
    # Binary name format: ahoy-bin-{os}-{arch}[v{arm_version}]-static
    binary: "{{ .ProjectName }}-bin-{{ .Os }}-{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}-static"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -v
    ldflags:
      - -s -w
      - -X main.version={{ .Tag }}
      - -X main.GitCommit={{ .ShortCommit }}
      - -X main.GitBranch={{ .Branch }}
      - -X main.BuildTime={{ .Date }}
      - -extldflags=-static
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # Standard archives
  - id: standard
    ids:
      - ahoy
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Archive name format: ahoy-{os}-{arch}[v{arm_version}]
    # Deliberately unversioned, matching the v2.x naming. The version belongs in
    # the release URL, not the filename, so that
    # releases/latest/download/ahoy-linux-amd64.tar.gz stays a stable link.
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    files:
      - README.md
      - LICENSE
      - examples/examples.ahoy.yml

  # Static archives
  - id: static
    ids:
      - ahoy-static
    formats:
      - tar.gz
    # Archive name format: ahoy-{os}-{arch}[v{arm_version}]-static
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}-static"
    files:
      - README.md
      - LICENSE
      - examples/examples.ahoy.yml

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256
  # The raw ahoy-bin-* binaries are added to the release through release.extra_files,
  # and are now included in the checksums file.
  extra_files:
    - glob: "dist/ahoy_**/ahoy-bin-*"
    - glob: "dist/ahoy-static_**/ahoy-bin-*-static"

snapshot:
  version_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^build:"
      - "^chore:"
      - Merge pull request
      - Merge branch
  groups:
    - title: "New Features"
      regexp: "^feat(\\([\\w\\-]+\\))?: .+$"
      order: 0
    - title: "Bug Fixes"
      regexp: "^fix(\\([\\w\\-]+\\))?: .+$"
      order: 1
    - title: "Enhancements"
      regexp: "^.*enhancement[(\\w)]*:+.*$"
      order: 2
    - title: "Other Changes"
      order: 999

sboms:
  # Regular builds SBOM
  - id: binary-regular
    artifacts: binary
    ids:
      - ahoy
    documents:
      # SBOM name format: ahoy_{version}_{os}_{arch}[v{arm_version}].sbom
      - "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}.sbom"

  # Static builds SBOM
  - id: binary-static
    artifacts: binary
    ids:
      - ahoy-static
    documents:
      # SBOM name format: ahoy_{version}_{os}_{arch}[v{arm_version}]_static.sbom
      - "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}_static.sbom"

# Sign the checksums file with cosign, keyless.
#
# The checksums file lists every other artifact so we just sign that
# and it verifies everything else.
#
# Keyless means cosign gets an OIDC token from the workflow, so the
# signature records which repository, workflow and ref produced it,
# and the certificate is logged to Rekor. The release job already
# grants the id-token: write permission this needs.
signs:
  - id: cosign-checksum
    cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "--yes"
      - "${artifact}"
    artifacts: checksum
    output: true

# Upload individual binaries as well as archives
release:
  github:
    owner: ahoy-cli
    name: ahoy
  draft: true
  replace_existing_draft: true
  mode: append
  prerelease: auto
  target_commitish: "{{ .Commit }}"
  # Upload extra files (individual binaries) - maintaining existing naming convention
  # No name_template here: these globs each match many files, and a single
  # name_template cannot name more than one output. Omitting it makes goreleaser
  # upload each file under its own basename, which is the naming we want anyway.
  # The "*.exe" files are already covered by the "ahoy-bin-*" glob.
  extra_files:
    - glob: "dist/ahoy_**/ahoy-bin-*"
    - glob: "dist/ahoy-static_**/ahoy-bin-*-static"

# Generate metadata for package managers
metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
